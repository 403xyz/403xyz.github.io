<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQQ · VIX 30 돌파 BUY</title>
<style>
  :root { --bg:#ffffff; --fg:#1c2430; --muted:#6b7684; --line:#e3e7ed; --buy:#0a8f5b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --fg:#e8edf3; --muted:#8b97a6; --line:#25303d; --buy:#2fd08f; }
  }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 14px; color:var(--muted); font-size:14px; }
  .bar { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:14px; }
  label { cursor:pointer; display:flex; gap:6px; align-items:center; }
  #chart { width:100%; height:520px; border:1px solid var(--line); border-radius:6px; }
  #msg { color:var(--muted); font-size:13px; margin-top:10px; }
  #count { color:var(--buy); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>QQQ 차트 · VIX 30 넘을 때 BUY</h1>
  <p class="sub">VIX 종가가 30을 넘은 날만 BUY로 표시해.</p>
  <div class="bar">
    <label><input type="checkbox" id="firstOnly" checked> 처음 30 넘은 날만 표시</label>
    <span>BUY 신호: <span id="count">0</span>개</span>
  </div>
  <div id="chart"></div>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  var THRESHOLD = 30;
  var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  var el = document.getElementById("chart");
  var chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: dark ? "#10151c" : "#ffffff" }, textColor: dark ? "#e8edf3" : "#1c2430" },
    grid: { vertLines: { color: dark ? "#25303d" : "#eef1f5" }, horzLines: { color: dark ? "#25303d" : "#eef1f5" } },
    rightPriceScale: { borderColor: dark ? "#25303d" : "#e3e7ed" },
    timeScale: { borderColor: dark ? "#25303d" : "#e3e7ed" }
  });
  var line = chart.addLineSeries({ color: "#2f6fed", lineWidth: 2 });
  var rows = [];

  function draw() {
    var firstOnly = document.getElementById("firstOnly").checked;
    var markers = [];
    var prevOver = false;
    for (var i = 0; i < rows.length; i++) {
      var over = rows[i].vix > THRESHOLD;
      if (over && (!firstOnly || !prevOver)) {
        markers.push({ time: rows[i].date, position: "belowBar", color: "#0a8f5b", shape: "arrowUp", text: "BUY" });
      }
      prevOver = over;
    }
    line.setMarkers(markers);
    document.getElementById("count").textContent = markers.length;
  }

  fetch("data.json?v=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      rows = d;
      line.setData(rows.map(function (x) { return { time: x.date, value: x.qqq }; }));
      draw();
      chart.timeScale().fitContent();
      document.getElementById("msg").textContent = "마지막 데이터: " + rows[rows.length - 1].date;
    })
    .catch(function () {
      document.getElementById("msg").textContent =
        "data.json을 못 불러왔어. 아래 안내의 '데이터 업데이트 실행' 단계를 먼저 해줘.";
    });

  document.getElementById("firstOnly").addEventListener("change", draw);
})();
</script>
</body>
</html>
