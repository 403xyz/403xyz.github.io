<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQQ · VIX BUY</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
html,body{height:100%;overflow:hidden}
body{margin:0;display:flex;flex-direction:column;background:#0d1117;color:#e6e8eb;font-family:-apple-system,"Malgun Gothic",sans-serif}
.row{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #1c222d;font-size:14px}
#r1{padding-right:200px}
h1{font-size:18px;margin:0 8px 0 0}
select,input,button{background:#1a202b;color:#e6e8eb;border:1px solid #2a3140;border-radius:8px;padding:8px 12px;font-size:14px}
input[type=number]{width:64px}
button{cursor:pointer}
button.on{background:#2962ff;border-color:#2962ff}
.dim{color:#8b94a5}
#info{flex-wrap:nowrap;white-space:nowrap;overflow-x:auto;min-height:20px}
#info b{color:#fff}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden}
#chart,#ov{position:absolute;left:0;top:0;width:100%;height:100%}
#ov{pointer-events:none;touch-action:none}
</style>
</head>
<body>
<div id="siteMenu" style="position:fixed;top:8px;right:8px;z-index:99999;font:13px sans-serif">
  <select style="padding:6px 8px;border-radius:6px;border:1px solid #2a3140;background:#1a202b;color:#e6e8eb">
    <option value="/">BTC 주봉 40MA</option>
    <option value="/qqq.html">QQQ + VIX BUY</option>
  </select>
</div>
<script>
(function(){var s=document.querySelector('#siteMenu select');
for(var i=0;i<s.options.length;i++){if(s.options[i].value===location.pathname)s.selectedIndex=i}
s.onchange=function(){location.href=s.value}})();
</script>

<div class="row" id="r1">
  <h1>QQQ · VIX BUY</h1>
  <span>봉</span>
  <select id="tf"><option value="1h">1시간</option><option value="4h">4시간</option><option value="1d" selected>1일</option><option value="1w">1주</option></select>
  <span>VIX 기준</span><input id="lvl" type="number" value="30">
  <label class="dim"><input id="first" type="checkbox" checked style="width:auto"> 처음 넘은 봉만</label>
  <button id="apply">적용</button>
</div>
<div class="row" id="tools"><span class="dim">그리기</span></div>
<div class="row" id="info">불러오는 중…</div>
<div id="wrap"><div id="chart"></div><canvas id="ov"></canvas></div>

<script>
const WORKER='https://shrill-shape-7c76qqq-proxy.nikemix99.workers.dev';
const $=i=>document.getElementById(i);
const CFG={'1h':'60m','4h':'60m','1d':'1d','1w':'1d'},FULL={'60m':'2y','1d':'max'};
const store={};let tf='1d',D=[],tool=null,cur=null,first=true,stamp='',ll=null,busy=false;
const intra=()=>tf==='1h'||tf==='4h';

const chart=LightweightCharts.createChart($('chart'),{autoSize:true,
 layout:{background:{color:'#0d1117'},textColor:'#8b94a5'},
 grid:{vertLines:{color:'#161b24'},horzLines:{color:'#161b24'}},
 rightPriceScale:{borderColor:'#2a3140',scaleMargins:{top:.05,bottom:.3}},
 timeScale:{borderColor:'#2a3140'}});
const cs=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
const vs=chart.addLineSeries({color:'#ffb300',lineWidth:1,priceScaleId:'vix',priceLineVisible:false});
chart.priceScale('vix').applyOptions({scaleMargins:{top:.78,bottom:.02}});
const TS=chart.timeScale();

// ---------- 데이터 ----------
function key(t,i){
 if(i==='60m')return t+32400; // 한국시간으로 표시
 return Date.parse(new Date(t*1000).toLocaleDateString('en-CA',{timeZone:'America/New_York'}))/1000;
}
async function get(sym,i,r){
 const j=await(await fetch(`${WORKER}/?s=${encodeURIComponent(sym)}&i=${i}&r=${r}`)).json();
 const x=j.chart.result[0],q=x.indicators.quote[0],o=[],n=x.timestamp.length-1;
 x.timestamp.forEach((t,k)=>{
  // 진행 중인 마지막 봉은 종가가 비어 오므로 현재가로 채움
  const c=q.close[k]??(k===n?x.meta.regularMarketPrice:null);
  if(c!=null)o.push({t:key(t,i),o:q.open[k]??c,h:Math.max(q.high[k]??c,c),l:Math.min(q.low[k]??c,c),c});
 });
 return o;
}
async function refresh(){
 const i=CFG[tf],S=store[i]||(store[i]={q:new Map(),v:new Map()});
 const r=S.q.size?'5d':FULL[i];
 const [q,v]=await Promise.all([get('QQQ',i,r),get('^VIX',i,r)]);
 q.forEach(b=>S.q.set(b.t,b));v.forEach(b=>S.v.set(b.t,b.c));
 stamp=new Date().toLocaleTimeString('ko-KR');
}
const mon=t=>t-((new Date(t*1000).getUTCDay()+6)%7)*86400;
function rows(){
 const S=store[CFG[tf]];if(!S)return[];let lv=0;
 const a=[...S.q.values()].sort((x,y)=>x.t-y.t).map(b=>{if(S.v.has(b.t))lv=S.v.get(b.t);return{...b,x:lv}});
 if(tf==='1h'||tf==='1d')return a;
 const o=[];let g=null,n=0,pt=0;
 for(const b of a){
  const w=tf==='1w',nw=w?(!g||mon(b.t)!==g.k):(!g||n>=4||b.t-pt>7200);
  if(nw){g={k:w?mon(b.t):0,t:w?mon(b.t):b.t,o:b.o,h:b.h,l:b.l,c:b.c,x:b.x};o.push(g);n=1}
  else{g.h=Math.max(g.h,b.h);g.l=Math.min(g.l,b.l);g.c=b.c;g.x=Math.max(g.x,b.x);n++}
  pt=b.t;
 }
 return o;
}
const fmt=t=>new Date(t*1000).toISOString().slice(0,intra()?16:10).replace('T',' ');

function render(){
 const a=rows();
 if(!a.length){cs.setData([]);vs.setData([]);cs.setMarkers([]);return}
 const L=parseFloat($('lvl').value)||30;
 chart.applyOptions({timeScale:{timeVisible:intra()}});
 cs.setData(a.map(b=>({time:b.t,open:b.o,high:b.h,low:b.l,close:b.c})));
 vs.setData(a.map(b=>({time:b.t,value:b.x})));
 if(ll)vs.removePriceLine(ll);
 ll=vs.createPriceLine({price:L,color:'#e91e63',lineStyle:2,lineWidth:1,title:'VIX '+L});
 const m=[];let p=false;
 for(const b of a){const o=b.x>L;if(o&&(!$('first').checked||!p))m.push({time:b.t,position:'belowBar',shape:'arrowUp',color:'#ff4081',text:'BUY'});p=o}
 cs.setMarkers(m);
 if(first){TS.fitContent();first=false}
 const l=a[a.length-1],s=m.length?m[m.length-1].time:null;
 $('info').innerHTML=`<span>현재가 <b>${l.c.toFixed(2)}</b> · VIX <b>${l.x.toFixed(2)}</b> · 상태 <b>${l.x>L?'VIX 기준 초과 (BUY 구간)':'VIX 기준 이하 (대기)'}</b> · 최근 신호 <b>${s?'BUY':'없음'}</b>${s?' ('+fmt(s)+')':''} · BUY ${m.length}번 · <span class="dim">갱신 ${stamp}</span></span>`;
 redraw();
}
async function load(){
 if(busy)return;busy=true;
 try{await refresh();render()}
 catch(e){$('info').textContent='데이터 실패: '+e}
 busy=false;
}

// ---------- 그리기 ----------
const wrap=$('wrap'),cv=$('ov'),cx=cv.getContext('2d');
const sk=()=>'d_'+tf;
const ld=()=>{try{D=JSON.parse(localStorage[sk()]||'[]')}catch(e){D=[]}};
const sv=()=>{try{localStorage[sk()]=JSON.stringify(D)}catch(e){}};
const P=d=>({x:TS.timeToCoordinate(d.t),y:cs.priceToCoordinate(d.p)});
const C=(x,y)=>{const t=TS.coordinateToTime(x),p=cs.coordinateToPrice(y);return t==null||p==null?null:{t,p}};

function paint(d){
 const a=P(d.a),b=d.b?P(d.b):a,W=cv.width,H=cv.height;
 if(d.k!=='h'&&(a.x==null||(d.b&&b.x==null)))return;
 cx.strokeStyle=cx.fillStyle='#ffd54f';cx.lineWidth=1.5;cx.font='12px sans-serif';
 const ln=(x1,y1,x2,y2)=>{cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke()};
 if(d.k==='h')ln(0,a.y,W,a.y);
 else if(d.k==='v')ln(a.x,0,a.x,H);
 else if(d.k==='trend')ln(a.x,a.y,b.x,b.y);
 else if(d.k==='rect'){cx.fillStyle='rgba(41,98,255,.15)';cx.strokeStyle='#4fc3f7';cx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);cx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}
 else if(d.k==='fib')[0,.236,.382,.5,.618,.786,1].forEach(v=>{
  const y=a.y+(b.y-a.y)*v,p=d.a.p+(d.b.p-d.a.p)*v,x1=Math.min(a.x,b.x);
  ln(x1,y,Math.max(a.x,b.x),y);cx.fillText(v+'  '+p.toFixed(2),x1+4,y-3)});
 else if(d.k==='measure'){
  const pc=(d.b.p/d.a.p-1)*100;cx.strokeStyle=cx.fillStyle=pc>=0?'#26a69a':'#ef5350';
  ln(a.x,a.y,b.x,b.y);cx.fillText((pc>=0?'+':'')+pc.toFixed(2)+'%',b.x+6,b.y)}
}
function redraw(){
 const w=wrap.clientWidth,h=wrap.clientHeight;
 if(cv.width!==w)cv.width=w;
 if(cv.height!==h)cv.height=h;
 cx.clearRect(0,0,w,h);D.forEach(paint);if(cur)paint(cur);
}
TS.subscribeVisibleTimeRangeChange(redraw);
new ResizeObserver(redraw).observe(wrap);
setInterval(redraw,200);

function seg(x,y,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/l));return Math.hypot(x-a.x-t*dx,y-a.y-t*dy)}
function erase(x,y){
 let bi=-1,bd=14;
 D.forEach((d,i)=>{const a=P(d.a),b=d.b?P(d.b):a;let m;
  if(d.k==='h')m=Math.abs(y-a.y);
  else if(d.k==='v')m=Math.abs(x-a.x);
  else if(d.k==='rect'||d.k==='fib')m=(x>=Math.min(a.x,b.x)&&x<=Math.max(a.x,b.x)&&y>=Math.min(a.y,b.y)&&y<=Math.max(a.y,b.y))?0:99;
  else m=seg(x,y,a,b);
  if(m<bd){bd=m;bi=i}});
 if(bi>=0){D.splice(bi,1);sv();redraw()}
}
function setTool(t){
 tool=tool===t?null:t;cv.style.pointerEvents=tool?'auto':'none';
 document.querySelectorAll('#tools button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));
}
const xy=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.onpointerdown=e=>{
 if(!tool)return;const[x,y]=xy(e);
 if(tool==='erase'){erase(x,y);return}
 const c=C(x,y);if(!c)return;
 if(tool==='h'||tool==='v'){D.push({k:tool,a:c});sv();setTool(null);redraw()}
 else{cur={k:tool,a:c,b:c};cv.setPointerCapture(e.pointerId)}
};
cv.onpointermove=e=>{if(!cur)return;const c=C(...xy(e));if(c){cur.b=c;redraw()}};
cv.onpointerup=()=>{if(!cur)return;D.push(cur);cur=null;sv();setTool(null);redraw()};

[['trend','추세선'],['h','수평선'],['v','수직선'],['fib','피보나치'],['rect','사각형'],['measure','재기'],['erase','지우개']].forEach(([k,n])=>{
 const b=document.createElement('button');b.textContent=n;b.dataset.t=k;b.onclick=()=>setTool(k);$('tools').append(b)});
[['되돌리기',()=>{D.pop();sv();redraw()}],['전체삭제',()=>{D=[];sv();redraw()}]].forEach(([n,fn])=>{
 const b=document.createElement('button');b.textContent=n;b.onclick=fn;$('tools').append(b)});

// ---------- 시작 ----------
$('tf').onchange=()=>{tf=$('tf').value;first=true;setT
