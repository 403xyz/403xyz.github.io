name: Update divergence chart

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-divergence-chart
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate chart
        run: python generate_chart.py

      - name: Commit and push
        run: |
          if git diff --quiet -- divergence.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add divergence.html
          git commit -m "Update divergence chart"
          git pull --rebase origin main
          git push
