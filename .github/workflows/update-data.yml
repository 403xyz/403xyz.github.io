name: update-data
on:
  schedule:
    - cron: '*/30 0-7,13-21 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download VIX
        continue-on-error: true
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -sSf -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?range=5y&interval=1d" -o data/vix.json
      - name: Download VKOSPI
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          mkdir -p data
          python3 scripts/fetch_vkospi.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "update data" || echo "no changes"
          git pull --rebase origin main
          git push
