name: update-data
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download data
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -sSf -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/QQQ?range=5y&interval=1d" -o data/qqq.json
          curl -sSf -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?range=5y&interval=1d" -o data/vix.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "update data" || echo "no changes"
          git push
