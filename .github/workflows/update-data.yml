name: update-data
on:
  schedule:
    - cron: '*/30 0-7,13-21 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download VIX
        continue-on-error: true
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          curl -sSf -A "$UA" "https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?range=5y&interval=1d" -o data/vix.json
      - name: Download VKOSPI
        continue-on-error: true
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, re, sys, datetime, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)", "Referer": "https://m.stock.naver.com/"}
          START = "2025-09-01"

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read()

          def num(x):
              return float(str(x).replace(",", ""))

          def naver_mobile(code):
              out = {}
              for page in range(1, 16):
                  data = json.loads(get(f"https://m.stock.naver.com/api/index/{code}/price?pageSize=60&page={page}").decode("utf-8"))
                  if not isinstance(data, list) or not data:
                      break
                  for row in data:
                      d, c = row.get("localTradedAt"), row.get("closePrice")
                      if d and c:
                          out[str(d)[:10]] = num(c)
                  if out and min(out) < START:
                      break
              return out

          def naver_pc(code):
              out = {}
              for page in range(1, 40):
                  html = get(f"https://finance.naver.com/sise/sise_index_day.naver?code={code}&page={page}").decode("euc-kr", "ignore")
                  rows = re.findall(r'<td class="date">\s*([\d.]+)\s*</td>\s*<td class="number_1">\s*([\d,.]+)\s*</td>', html)
                  if not rows:
                      break
                  for d, c in rows:
                      out[d.replace(".", "-")] = num(c)
                  if out and min(out) < START:
                      break
              return out

          def yahoo(sym):
              j = json.loads(get(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=2y&interval=1d"))
              r = j["chart"]["result"][0]
              out = {}
              for t, c in zip(r["timestamp"], r["indicators"]["quote"][0]["close"]):
                  if c is not None:
                      out[datetime.datetime.utcfromtimestamp(t + r["meta"].get("gmtoffset", 0)).strftime("%Y-%m-%d")] = float(c)
              return out

          SOURCES = [
              ("naver-mobile VKOSPI", lambda: naver_mobile("VKOSPI")),
              ("naver-pc VKOSPI", lambda: naver_pc("VKOSPI")),
              ("yahoo ^VKOSPI", lambda: yahoo("%5EVKOSPI")),
          ]
          for name, fn in SOURCES:
              try:
                  data = fn()
                  print(name, "->", len(data), "rows")
                  if len(data) >= 20:
                      with open("data/vkospi.json", "w") as f:
                          json.dump({"source": name, "updated": datetime.datetime.utcnow().isoformat() + "Z", "data": data}, f)
                      print("OK", name, "latest", max(data), data[max(data)])
                      sys.exit(0)
              except Exception as e:
                  print(name, "FAILED:", repr(e))
          print("ALL VKOSPI SOURCES FAILED")
          sys.exit(1)
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "update data" || echo "no changes"
          git push
