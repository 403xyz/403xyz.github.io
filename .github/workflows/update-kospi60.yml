name: Update KOSPI 60m
on:
  schedule:
    - cron: '10 0-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kospi60
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch KOSPI 60m
        run: python scripts/update_kospi60.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kospi60.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update kospi60"
            git pull --rebase origin main
            git push
          fi
