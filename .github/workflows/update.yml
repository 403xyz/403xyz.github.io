name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance
      - name: Make data.json
        run: |
          python - <<'EOF'
          import json
          import yfinance as yf
          q = yf.download("QQQ", period="max", auto_adjust=False, progress=False)["Close"]
          v = yf.download("^VIX", period="max", auto_adjust=False, progress=False)["Close"]
          q = q.squeeze().dropna()
          v = v.squeeze().dropna()
          rows = []
          for d, price in q.items():
              if d in v.index:
                  rows.append({"date": d.strftime("%Y-%m-%d"),
                               "qqq": round(float(price), 2),
                               "vix": round(float(v[d]), 2)})
          json.dump(rows, open("data.json", "w"))
          print(len(rows), "rows")
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "update data"
          git push
